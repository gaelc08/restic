name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      # Scripts only: config/*.example are sourced variable files or plain
      # data files, not scripts. Options come from .shellcheckrc.
      - run: shellcheck install.sh bin/*.sh bin/resticctl tests/*.sh
      - run: bash -n install.sh bin/*.sh bin/resticctl
      # End-to-end test of restic-capacity-metrics.sh with a fake restic (needs jq, preinstalled).
      - run: tests/test-capacity-metrics.sh
